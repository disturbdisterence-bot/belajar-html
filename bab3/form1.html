<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!--label yang terhubung dengan input-->

    <label for="gmail">Alamat Gmail</label>
    <input type="gmail" id="gmail" name="gmail" required placeholder="contoh@gmail.com">

    <!--Textarea-->
    <label for="pesan">Pesan:</label>
    <textarea id="pesan" name="pesan" rows="5" cols="40" placeholder="Tuliskan pesan kamu disini ..."></textarea>

    <!--select/dropdown-->
    <label for="jurusan">pilih jurusan:</label>
    <select id="jurusan" name="jurusan">
        <option value="">pilih jurusan</option>
        <optgroup>
            <option value="rpl">rekayasa perangkat lunat</option>
            <option value="tkj">teknik komputer jaringan</option>
        </optgroup>
        <optgroup label="Bisnis">
            <option value="ak">akutansi</option>
            <option value="pm">pemasaran</option>
        </optgroup>
    </select>
    <!--fieldset and legend-->
    <fieldset>
        
</body>
</html>
