<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--radio button: hanya bisa memilih satu opsi-->
    <!--gunakan name sama untuk mengelompokan pilihan-->
    <p>jenis kelamin:</p>
    <input type="radio" id="laki" name="gender" value="L">
    <label for="laki">laki laki</label>

    <input type="radio" id="perempuan" name="gender" value="p">
    <label for="perempuan">perempuan</label>

    <!--checkbox: bisa memilih lebih dari satu opsi-->
    <p>hobi(boleh pilih lebih)</p>
    <input type="checkbox" id="coding" name="hobi" value="coding">
    <label for="coding">coding</label>

    <input type="checkbox" id="membaca" name="hobi" value="membaca">
    <label for="membaca">membaca</label>

    <input type="checkbox" id="gaming" name="hobi" value="gaming">
    <label for="gaming">gaming</label>

    <!--checkbox dengan checked (sudah dicentang secara default)-->
    <input type="checkbox" id="setuju" name="setuju" value="ya" checked>
    <label for="setuju">saya menyetujui syarat dan ketentuan</label>
</body>
</html>
